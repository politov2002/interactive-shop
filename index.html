<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Карта станков</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f1720; color: #e6edf3;
    user-select: none; touch-action: none;
  }

  header {
    background: #1a2430;
    padding: 10px 20px;
    display: flex; align-items: center; gap: 20px;
    border-bottom: 1px solid #2a3746;
    flex-wrap: wrap;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .kpi { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; }
  .kpi-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9fb0c3; }
  .kpi-dot { width: 10px; height: 10px; border-radius: 50%; }
  .kpi-val { color: #fff; font-weight: 700; font-size: 15px; }

  main { display: flex; height: calc(100% - 56px); }

  .map {
    flex: 1; position: relative; overflow: hidden;
    background:
      linear-gradient(#1b2735 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, #1b2735 1px, transparent 1px) 0 0/40px 40px,
      #101923;
    touch-action: none;
  }
  .map-inner {
    position: absolute; inset: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  .machine {
    position: absolute;
    width: 130px; height: 90px;
    border-radius: 12px;
    background: #1e2c3a;
    border: 2px solid #2f4256;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: box-shadow .2s, border-color .2s;
    font-size: 12px;
  }
  .machine .id { font-weight: 700; font-size: 20px; }
  .machine .op { font-size: 12px; color: #9fb0c3; margin-top: 4px; }
  .machine .pulse {
    position: absolute; top: 8px; right: 8px;
    width: 12px; height: 12px; border-radius: 50%;
  }
  .machine.running { border-color: #2ecc71; box-shadow: 0 0 16px rgba(46,204,113,.35); }
  .machine.running .pulse { background: #2ecc71; animation: pulse 1.5s infinite; }
  .machine.idle    { border-color: #f1c40f; }
  .machine.idle .pulse { background: #f1c40f; }
  .machine.repair  { border-color: #3498db; opacity: .8; }
  .machine.repair .pulse { background: #3498db; }
  .machine.alarm   { border-color: #e74c3c; box-shadow: 0 0 20px rgba(231,76,60,.6); }
  .machine.alarm .pulse { background: #e74c3c; animation: pulse .7s infinite; }
  .machine.selected { outline: 3px solid #58a6ff; outline-offset: 3px; }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(1.5); }
  }

  aside {
    width: 360px;
    background: #1a2430;
    border-left: 1px solid #2a3746;
    padding: 20px;
    overflow-y: auto;
    transition: transform .3s;
    display: flex; flex-direction: column;
  }
  aside.hidden { transform: translateX(100%); width: 0; padding: 0; overflow: hidden; }
  aside h2 { font-size: 20px; margin-bottom: 8px; }
  .close-btn {
    float: right; background: none; border: none; color: #9fb0c3;
    font-size: 24px; cursor: pointer; padding: 0 8px;
  }
  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #24323f; font-size: 14px;
  }
  .detail-row span:first-child { color: #9fb0c3; }
  .status-badge {
    padding: 4px 12px; border-radius: 14px;
    font-size: 12px; font-weight: 700; text-transform: uppercase;
  }
  .badge-running { background: rgba(46,204,113,.15); color: #2ecc71; }
  .badge-idle    { background: rgba(241,196,15,.15); color: #f1c40f; }
  .badge-repair  { background: rgba(52,152,219,.15); color: #3498db; }
  .badge-alarm   { background: rgba(231,76,60,.15); color: #e74c3c; }
  .placeholder { color: #6b7d92; font-size: 14px; text-align: center; margin-top: 40px; }
  .progress { height: 8px; background: #24323f; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: #58a6ff; transition: width .4s; }

  /* ===== ПЛАШКИ-ВКЛАДКИ (быстрые заметки) ===== */
  .notes-tabs {
    position: fixed;
    right: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 500;
  }
  .note-tab {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    border-radius: 30px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .2s;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    user-select: none;
  }
  .note-tab.op  { background: #2a2f1e; color: #f1c40f; border-color: rgba(241,196,15,.5); }
  .note-tab.pr  { background: #1e2a3a; color: #58a6ff; border-color: rgba(88,166,255,.5); }
  .note-tab .count {
    background: rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
  }
  .note-tab.active { transform: translateY(-3px); }

  /* ===== МОДАЛКА-БЛОКНОТ ===== */
  .notebook-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    justify-content: flex-end;
    z-index: 900;
    padding: 20px;
  }
  .notebook-modal.open { display: flex; }
  .notebook {
    background: #1a2430;
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    border: 1px solid #2a3746;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .notebook-header {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #24323f;
  }
  .notebook-header h3 { font-size: 18px; flex: 1; }
  .notebook-header .accent { width: 6px; height: 24px; border-radius: 3px; }
  .notebook-close {
    background: none; border: none; color: #9fb0c3;
    font-size: 24px; cursor: pointer; padding: 0 8px;
    line-height: 1;
  }

  .notebook-input {
    padding: 16px 20px;
    border-bottom: 1px solid #24323f;
    display: flex; flex-direction: column; gap: 10px;
  }
  .notebook-input textarea {
    width: 100%;
    min-height: 90px;
    background: #0f1720;
    border: 1px solid #2a3746;
    border-radius: 10px;
    padding: 12px;
    color: #e6edf3;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
    transition: border .2s;
  }
  .notebook-input textarea:focus { border-color: #58a6ff; }
  .notebook-input .row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .notebook-input .hint { font-size: 12px; color: #6b7d92; }
  .btn-add {
    background: #58a6ff; color: #0f1720;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-add:hover { background: #7ab8ff; }
  .btn-add:active { transform: scale(.97); }

  .notes-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .note-item {
    background: #0f1720;
    border: 1px solid #24323f;
    border-radius: 10px;
    padding: 12px 14px;
    position: relative;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .note-item .text { color: #e6edf3; white-space: pre-wrap; }
  .note-item .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px;
    font-size: 11px; color: #6b7d92;
  }
  .note-item .del {
    background: none; border: none;
    color: #e74c3c;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background .2s;
  }
  .note-item .del:hover { background: rgba(231,76,60,.15); }

  .empty-notes {
    text-align: center;
    color: #6b7d92;
    padding: 30px 20px;
    font-size: 13px;
  }

  /* Кнопка установки PWA */
  #installBtn {
    display: none;
    position: fixed; bottom: 20px; left: 20px;
    background: #58a6ff; color: #0f1720;
    border: none; padding: 14px 22px;
    border-radius: 30px; font-size: 15px; font-weight: 700;
    cursor: pointer; z-index: 1000;
    box-shadow: 0 6px 20px rgba(88,166,255,.4);
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  #installBtn.show { display: block; }

  @media (max-width: 900px) {
    aside { position: fixed; top: 56px; right: 0; bottom: 0; width: 85%; z-index: 100; }
    h1 { font-size: 14px; }
    .kpi { gap: 10px; }
    .kpi-item { font-size: 11px; }
    .kpi-val { font-size: 13px; }
    .notes-tabs { flex-direction: column; }
    .notebook { max-height: 90vh; }
  }
</style>
</head>
<body>

<header>
  <h1>🏭 Цех №1</h1>
  <div class="kpi">
    <div class="kpi-item"><span class="kpi-dot" style="background:#2ecc71"></span>Работают: <span class="kpi-val" id="kpiRun">0</span></div>
    <div class="kpi-item"><span class="kpi-dot" style="background:#f1c40f"></span>Простой: <span class="kpi-val" id="kpiIdle">0</span></div>
    <div class="kpi-item"><span class="kpi-dot" style="background:#3498db"></span>Ремонт: <span class="kpi-val" id="kpiRep">0</span></div>
    <div class="kpi-item"><span class="kpi-dot" style="background:#e74c3c"></span>Авария: <span class="kpi-val" id="kpiAlarm">0</span></div>
  </div>
</header>

<main>
  <div class="map" id="map">
    <div class="map-inner" id="mapInner"></div>
  </div>
  <aside id="panel" class="hidden">
    <button class="close-btn" id="closeBtn">✕</button>
    <h2>Детали станка</h2>
    <p class="placeholder">Выберите станок</p>
  </aside>
</main>

<!-- ===== ПЛАШКИ-ВКЛАДКИ ===== -->
<div class="notes-tabs">
  <div class="note-tab op" id="tabOp">
    ⚡ Оперативные вопросы
    <span class="count" id="countOp">0</span>
  </div>
  <div class="note-tab pr" id="tabPr">
    🏭 Производственные вопросы
    <span class="count" id="countPr">0</span>
  </div>
</div>

<!-- ===== МОДАЛКА-БЛОКНОТ ===== -->
<div class="notebook-modal" id="notebookModal">
  <div class="notebook">
    <div class="notebook-header">
      <div class="accent" id="notebookAccent"></div>
      <h3 id="notebookTitle">Блокнот</h3>
      <button class="notebook-close" id="notebookClose">✕</button>
    </div>

    <div class="notebook-input">
      <textarea id="noteInput" placeholder="Введите текст заметки..."></textarea>
      <div class="row">
        <span class="hint">💾 Сохраняется автоматически</span>
        <button class="btn-add" id="btnAddNote">➕ Добавить</button>
      </div>
    </div>

    <div class="notes-list" id="notesList"></div>
  </div>
</div>

<button id="installBtn">📲 Установить приложение</button>

<script>
/* =======================================================
   1. КАРТА СТАНКОВ
======================================================= */
const machines = [
  { id: 'CNC-01',  x: 40,  y: 40,  status: 'running', operator: 'Иванов А.',  load: 87, output: 1240 },
  { id: 'CNC-02',  x: 220, y: 40,  status: 'running', operator: 'Петров С.',  load: 92, output: 1380 },
  { id: 'CNC-03',  x: 400, y: 40,  status: 'idle',    operator: '—',          load: 0,  output: 980  },
  { id: 'CNC-04',  x: 40,  y: 180, status: 'running', operator: 'Сидоров В.', load: 78, output: 1120 },
  { id: 'LATHE-1', x: 220, y: 180, status: 'alarm',   operator: 'Кузнецов Д.',load: 45, output: 640  },
  { id: 'LATHE-2', x: 400, y: 180, status: 'running', operator: 'Морозов И.', load: 95, output: 1450 },
  { id: 'MILL-01', x: 40,  y: 320, status: 'repair',  operator: '—',          load: 0,  output: 720  },
  { id: 'MILL-02', x: 220, y: 320, status: 'running', operator: 'Волков П.',  load: 81, output: 1010 },
  { id: 'PRESS-1', x: 400, y: 320, status: 'idle',    operator: '—',          load: 0,  output: 540  },
  { id: 'PRESS-2', x: 580, y: 180, status: 'running', operator: 'Зайцев Н.',  load: 88, output: 1290 },
];

const statusLabels = {
  running: 'Работает', idle: 'Простой', repair: 'Ремонт', alarm: 'Авария'
};

const mapEl = document.getElementById('map');
const mapInner = document.getElementById('mapInner');
const panel = document.getElementById('panel');
const closeBtn = document.getElementById('closeBtn');
let selectedId = null;

function render() {
  mapInner.innerHTML = '';
  machines.forEach(m => {
    const el = document.createElement('div');
    el.className = `machine ${m.status}` + (selectedId === m.id ? ' selected' : '');
    el.style.left = m.x + 'px';
    el.style.top  = m.y + 'px';
    el.innerHTML = `
      <div class="pulse"></div>
      <div class="id">${m.id}</div>
      <div class="op">${m.operator}</div>
    `;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedId = m.id;
      render();
      renderPanel();
      panel.classList.remove('hidden');
    });
    mapInner.appendChild(el);
  });
  updateKPI();
}

function updateKPI() {
  const counts = { running:0, idle:0, repair:0, alarm:0 };
  machines.forEach(m => counts[m.status]++);
  document.getElementById('kpiRun').textContent   = counts.running;
  document.getElementById('kpiIdle').textContent  = counts.idle;
  document.getElementById('kpiRep').textContent   = counts.repair;
  document.getElementById('kpiAlarm').textContent = counts.alarm;
}

function renderPanel() {
  const m = machines.find(x => x.id === selectedId);
  if (!m) return;
  panel.innerHTML = `
    <button class="close-btn" id="closeBtn">✕</button>
    <h2>${m.id}</h2>
    <div class="detail-row"><span>Статус</span>
      <span class="status-badge badge-${m.status}">${statusLabels[m.status]}</span>
    </div>
    <div class="detail-row"><span>Оператор</span><span>${m.operator}</span></div>
    <div class="detail-row"><span>Загрузка</span><span>${m.load}%</span></div>
    <div class="progress"><div style="width:${m.load}%"></div></div>
    <div class="detail-row" style="margin-top:14px"><span>Выработка, шт/см</span><span>${m.output}</span></div>
    <div class="detail-row"><span>Наработка, ч</span><span>${(m.output/50).toFixed(1)}</span></div>
  `;
  document.getElementById('closeBtn').onclick = () => {
    panel.classList.add('hidden');
    selectedId = null;
    render();
  };
}

closeBtn.onclick = () => {
  panel.classList.add('hidden');
  selectedId = null;
  render();
};

// Зум/панорамирование
let scale = 1, panX = 0, panY = 0;
let lastDist = 0, lastX = 0, lastY = 0;

mapEl.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.hypot(dx, dy);
  }
}, { passive: true });

mapEl.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    panX += x - lastX;
    panY += y - lastY;
    lastX = x; lastY = y;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    if (lastDist > 0) {
      scale = Math.max(0.5, Math.min(3, scale * (dist / lastDist)));
    }
    lastDist = dist;
  }
  applyTransform();
}, { passive: true });

mapEl.addEventListener('touchend', () => { lastDist = 0; });

mapEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  scale = Math.max(0.5, Math.min(3, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
  applyTransform();
}, { passive: false });

function applyTransform() {
  mapInner.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

// Обновления «живых» данных
setInterval(() => {
  machines.forEach(m => {
    if (m.status === 'running') {
      m.output += Math.floor(Math.random() * 5);
      m.load = Math.min(100, Math.max(60, m.load + (Math.random()*10 - 5)));
    }
  });
  if (selectedId) renderPanel();
}, 3000);

setInterval(() => {
  const m = machines[Math.floor(Math.random() * machines.length)];
  if (m.status === 'running' && Math.random() < 0.15) {
    m.status = 'idle'; m.load = 0; m.operator = '—';
  } else if (m.status === 'idle' && Math.random() < 0.5) {
    m.status = 'running'; m.load = 75; m.operator = 'Новый оп.';
  }
  render();
}, 5000);

/* =======================================================
   2. БЛОКНОТЫ (Оперативные / Производственные)
======================================================= */

// Храним заметки в localStorage
const STORAGE_KEYS = {
  operational: 'machine-map-notes-operational',
  production:  'machine-map-notes-production'
};

const notebooks = {
  operational: {
    title: '⚡ Оперативные вопросы',
    accent: '#f1c40f',
    notes: JSON.parse(localStorage.getItem(STORAGE_KEYS.operational) || '[]')
  },
  production: {
    title: '🏭 Производственные вопросы',
    accent: '#58a6ff',
    notes: JSON.parse(localStorage.getItem(STORAGE_KEYS.production) || '[]')
  }
};

let currentNotebook = null; // 'operational' | 'production' | null

// DOM
const modal       = document.getElementById('notebookModal');
const modalTitle  = document.getElementById('notebookTitle');
const modalAccent = document.getElementById('notebookAccent');
const notesList   = document.getElementById('notesList');
const noteInput   = document.getElementById('noteInput');
const btnAddNote  = document.getElementById('btnAddNote');
const countOp     = document.getElementById('countOp');
const countPr     = document.getElementById('countPr');
const tabOp       = document.getElementById('tabOp');
const tabPr       = document.getElementById('tabPr');
const notebookClose = document.getElementById('notebookClose');

// Сохранение
function persist(type) {
  localStorage.setItem(STORAGE_KEYS[type], JSON.stringify(notebooks[type].notes));
  updateCounters();
}

function updateCounters() {
  countOp.textContent = notebooks.operational.notes.length;
  countPr.textContent = notebooks.production.notes.length;
}

// Открыть блокнот
function openNotebook(type) {
  currentNotebook = type;
  const nb = notebooks[type];
  modalTitle.textContent  = nb.title;
  modalAccent.style.background = nb.accent;
  modal.classList.add('open');
  tabOp.classList.toggle('active', type === 'operational');
  tabPr.classList.toggle('active', type === 'production');
  renderNotes();
  // Фокус на textarea только если не планшет (чтобы не дёргать клавиатуру)
  if (window.innerWidth > 900) noteInput.focus();
}

function closeNotebook() {
  modal.classList.remove('open');
  currentNotebook = null;
  tabOp.classList.remove('active');
  tabPr.classList.remove('active');
}

// Отрисовка заметок
function renderNotes() {
  if (!currentNotebook) return;
  const notes = notebooks[currentNotebook].notes;

  if (notes.length === 0) {
    notesList.innerHTML = `<div class="empty-notes">📭 Пока нет заметок.<br>Добавьте первую запись выше.</div>`;
    return;
  }

  // Сортируем: новые сверху
  const sorted = [...notes].sort((a, b) => b.createdAt - a.createdAt);

  notesList.innerHTML = sorted.map(n => `
    <div class="note-item" data-id="${n.id}">
      <div class="text">${escapeHtml(n.text)}</div>
      <div class="meta">
        <span>${formatDate(n.createdAt)}</span>
        <button class="del" data-del="${n.id}" title="Удалить">🗑</button>
      </div>
    </div>
  `).join('');

  // Делегирование клика на удаление
  notesList.querySelectorAll('.del').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.del;
      notebooks[currentNotebook].notes = notebooks[currentNotebook].notes.filter(x => x.id !== id);
      persist(currentNotebook);
      renderNotes();
    };
  });
}

// Добавление
function addNote() {
  const text = noteInput.value.trim();
  if (!text) return;
  const note = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    text,
    createdAt: Date.now()
  };
  notebooks[currentNotebook].notes.push(note);
  persist(currentNotebook);
  noteInput.value = '';
  renderNotes();
  // Мягкая вибро-отдача (Android)
  if (navigator.vibrate) navigator.vibrate(30);
}

// Утилиты
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function formatDate(ts) {
  const d = new Date(ts);
  const pad = x => String(x).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Обработчики
tabOp.onclick = () => openNotebook('operational');
tabPr.onclick = () => openNotebook('production');
notebookClose.onclick = closeNotebook;
btnAddNote.onclick = addNote;

noteInput.addEventListener('keydown', (e) => {
  // Ctrl+Enter или Cmd+Enter — быстрое добавление
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    addNote();
  }
});

// Клик вне блокнота — закрыть
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeNotebook();
});

// Esc — закрыть
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('open')) closeNotebook();
});

// Инициализация счётчиков
updateCounters();

/* =======================================================
   3. PWA
======================================================= */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') installBtn.classList.remove('show');
  deferredPrompt = null;
});

window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));

/* =======================================================
   4. СТАРТ
======================================================= */
render();
</script>
</body>
</html>
