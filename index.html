<script>
// ⚠️ ЗАМЕНИТЕ your-project-id на ID вашего Firebase-проекта
const BASE = "https://your-project-id.firebaseio.com";
const url = BASE + "/.json";

let macs = [];
let curId = null;

const initialData = { /* ... без изменений ... */ };

// экранирование HTML
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function loadData() {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("HTTP " + response.status);
    let data = await response.json();
    if (!data) {
      await fetch(url, { method: "PUT", body: JSON.stringify(initialData) });
      data = initialData;
    }
    macs = Object.values(data);
    render();
  } catch (e) {
    console.error("loadData error:", e);
  }
}

function render(){
  const grid = document.getElementById('g');
  grid.innerHTML = '';
  let grp = '';

  macs.forEach(m=>{
    let gName = m.type==='milling' ? 'Фрезерная группа'
              : m.type==='turning' ? 'Токарная группа'
              : 'Производственные вопросы';

    if (grp !== gName) {
      grp = gName;
      const t = document.createElement('h2');
      t.className = 'gt';
      t.innerText = grp;
      grid.appendChild(t);
    }

    const c = document.createElement('div');
    c.className = `card ${m.status}`;
    if (m.status === 'break') c.classList.add('break-active');
    c.onclick = () => openM(m.id);

    let lbl = m.status==='work' ? 'В работе'
            : m.status==='setup' ? 'Наладка'
            : m.status==='break' ? 'Поломка'
            : 'Нет заготовки';

    if (m.type === 'issue') {
      lbl = m.status==='work' ? 'Норма'
          : m.status==='setup' ? 'Обсуждение'
          : m.status==='break' ? 'Внимание'
          : 'Ожидание';
    }

    c.innerHTML = `
      <div class="ch">
        <div>${esc(m.name)}</div>
        <div style="font-size:0.75rem;color:var(--m)">${esc(m.cnc)}</div>
      </div>
      <div class="st-t" style="font-size:0.8rem;font-weight:bold;margin-bottom:8px">${lbl}</div>
      <div class="row"><span>${m.type==='issue'?'Задача:':'Деталь:'}</span><span>${esc(m.part)}</span></div>
      <div class="row"><span>${m.type==='issue'?'Задач:':'Готово:'}</span><span>${esc(m.count)} ${m.type==='issue'?'активно':'шт'}</span></div>
      <div class="row"><span>${m.type==='issue'?'Приоритет:':'Загрузка:'}</span><span>${esc(m.load)}%</span></div>`;
    grid.appendChild(c);
  });

  const w = macs.filter(m=>m.type!=='issue' && m.status==='work').length;
  const s = macs.filter(m=>m.type!=='issue' && m.status==='setup').length;
  const b = macs.filter(m=>m.type!=='issue' && m.status==='break').length;

  document.getElementById('wc').innerText = w;
  document.getElementById('sc').innerText = s;
  document.getElementById('bc').innerText = b;

  let tL = 0, wM = 0;
  macs.forEach(m=>{
    if (m.type!=='issue' && m.status==='work') { tL += m.load; wM++; }
  });

  let oee = wM > 0 ? Math.round((tL/wM) * (1 - (b/11))) : 0;
  oee = Math.max(0, Math.min(100, oee));
  document.getElementById('oee').innerText = oee + '%';
}

function openM(id){
  curId = id;
  const m = macs.find(x=>x.id===id);
  if (!m) return;

  document.getElementById('lbl-part').innerText  = m.type==='issue' ? "Тема вопроса / Задача:" : "Изготавливаемая деталь:";
  document.getElementById('lbl-count').innerText = m.type==='issue' ? "Количество активных задач:" : "Количество (шт):";
  document.getElementById('lbl-load').innerText  = m.type==='issue' ? "Важность / Приоритет (%):" : "Текущая загрузка (%):";

  document.getElementById('mt').innerText = m.name;
  document.getElementById('fst').value = m.status;
  document.getElementById('fp').value  = m.part;
  document.getElementById('fc').value  = m.count;
  document.getElementById('fl').value  = m.load;

  document.getElementById('ov').style.display = 'flex';
}

function closeM(){
  document.getElementById('ov').style.display = 'none';
  curId = null;
}

async function saveM(){
  if (curId === null) return;

  const updateUrl = `${BASE}/${curId}.json`;   // ✅ исправлено
  const updates = {
    status: document.getElementById('fst').value,
    part:   document.getElementById('fp').value,
    count:  parseInt(document.getElementById('fc').value, 10) || 0,
    load:   parseInt(document.getElementById('fl').value, 10) || 0
  };

  try {
    const res = await fetch(updateUrl, { method: "PATCH", body: JSON.stringify(updates) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    closeM();
    await loadData();
  } catch (e) {
    console.error("saveM error:", e);
    alert("Не удалось сохранить. Проверьте подключение к Firebase.");
  }
}

loadData();
setInterval(loadData, 3000);
</script>
