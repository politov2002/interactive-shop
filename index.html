<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Центральный Ситуационный Центр</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#121214; --c:#1e1e24; --t:#f0faf2; --m:#94a3b8;
    --w:#10b981; --s:#f59e0b; --b:#ef4444; --n:#3b82f6; --brd:#334155;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:var(--bg);color:var(--t);padding:20px;min-height:100vh}
  header{text-align:center;margin-bottom:20px}
  header h1{font-size:clamp(1.1rem,2.5vw,1.8rem)}
  .stats{display:flex;gap:15px;margin-top:15px;justify-content:center;flex-wrap:wrap}
  .st-card{background:var(--c);border:1px solid var(--brd);padding:10px 20px;border-radius:10px;text-align:center;min-width:110px}
  .st-card h3{font-size:.75rem;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .val{font-size:1.5rem;font-weight:700}
  .toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:15px;flex-wrap:wrap;align-items:center}
  .toolbar button{background:#1e293b;color:#cbd5e1;border:1px solid var(--brd);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
  .toolbar button:hover{background:#334155}
  .toolbar .btn-login{background:#4f46e5;color:#fff;border-color:#4f46e5}
  .toolbar .btn-login:hover{background:#4338ca}
  .toolbar .btn-logout{background:#7f1d1d;color:#fecaca;border-color:#7f1d1d}
  .toolbar .btn-logout:hover{background:#991b1b}
  .badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:#0f172a;border:1px solid var(--brd);color:var(--m);margin-left:6px;vertical-align:middle}
  .badge.live{color:var(--w);border-color:var(--w)}
  .badge.offline{color:var(--b);border-color:var(--b)}
  .badge.role-admin{color:#fbbf24;border-color:#fbbf24}
  .badge.role-guest{color:#94a3b8;border-color:#475569}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .gt{grid-column:1/-1;margin:15px 0 5px;color:var(--m);border-left:4px solid #64748b;padding-left:10px;font-size:1rem}
  .gt.milling     { border-left-color:#64748b; }
  .gt.turning     { border-left-color:#64748b; }
  .gt.operational { border-left-color:var(--n); color:#93c5fd; }
  .gt.production  { border-left-color:#a855f7; color:#d8b4fe; }

  .card{background:var(--c);border:2px solid var(--brd);border-radius:12px;padding:15px;cursor:pointer;position:relative;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:#475569}
  .card::before{content:'';position:absolute;top:0;left:0;width:100%;height:5px;border-radius:12px 12px 0 0}
  .card.work::before{background:var(--w)}
  .card.setup::before{background:var(--s)}
  .card.break::before{background:var(--b)}
  .card.no-mat::before{background:var(--n)}
  .card.op-ok::before{background:var(--w)}
  .card.op-alert::before{background:var(--b)}
  .card.pr-ok::before{background:var(--w)}
  .card.pr-alert::before{background:var(--b)}
  @keyframes pulse{50%{border-color:var(--b)}}
  .card.break-active{animation:pulse 2s infinite}
  .card.issue-alert{animation:pulse 2s infinite}

  .ch{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:bold;font-size:.95rem}
  .ch > div:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;margin-bottom:4px;color:var(--m)}
  .row span:last-child{color:var(--t);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}

  .reason{margin-top:10px;font-size:.82rem;padding:8px 10px;border-radius:6px;border-left:3px solid;background:rgba(0,0,0,.25);word-break:break-word}
  .reason.break{color:#fca5a5;border-color:var(--b);background:rgba(239,68,68,.1)}
  .reason.setup{color:#fcd34d;border-color:var(--s);background:rgba(245,158,11,.1)}
  .reason.no-mat{color:#93c5fd;border-color:var(--n);background:rgba(59,130,246,.1)}
  .reason-label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-bottom:2px}

  .note-preview{margin-top:8px;font-size:.82rem;color:#cbd5e1;background:#0f172a;border:1px solid var(--brd);border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-word;max-height:110px;overflow:hidden;position:relative}
  .note-preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:24px;background:linear-gradient(transparent,#0f172a)}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:9;padding:15px}
  .ov.active{display:flex}
  .modal{background:#1e1e24;border:1px solid var(--brd);padding:20px;border-radius:12px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
  .modal .ch{margin-bottom:15px}
  .fg{margin-bottom:10px}
  .fg label{display:block;font-size:.8rem;color:var(--m);margin-bottom:4px}
  .fg select,.fg input,.fg textarea{width:100%;background:#0f172a;border:1px solid var(--brd);padding:8px;border-radius:6px;color:#fff;outline:none;font-size:.9rem;font-family:inherit}
  .fg textarea{min-height:80px;resize:vertical}
  .fg select:focus,.fg input:focus,.fg textarea:focus{border-color:#6366f1}
  .btn{width:100%;background:#4f46e5;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:.95rem}
  .btn:hover{background:#4338ca}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn-secondary{background:#334155}
  .btn-secondary:hover{background:#475569}
  .status-toggle{display:flex;gap:10px}
  .status-toggle label{flex:1;cursor:pointer;display:block}
  .status-toggle input{display:none}
  .status-toggle .opt{padding:10px;text-align:center;border:2px solid var(--brd);border-radius:8px;font-weight:600;font-size:.9rem;transition:all .15s}
  .status-toggle input:checked + .opt.ok{border-color:var(--w);background:rgba(16,185,129,.12);color:var(--w)}
  .status-toggle input:checked + .opt.alert{border-color:var(--b);background:rgba(239,68,68,.12);color:var(--b)}
  .status-toggle .opt:hover{border-color:#64748b}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .cal-head .month{font-weight:bold;font-size:1rem}
  .cal-nav{background:#334155;border:none;color:#fff;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:1rem}
  .cal-nav:hover{background:#475569}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .cal-weekdays div{text-align:center;font-size:.7rem;color:var(--m);text-transform:uppercase;padding:4px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-day{aspect-ratio:1;background:#0f172a;border:1px solid var(--brd);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;color:var(--m);position:relative;transition:border-color .12s,transform .12s}
  .cal-day:hover{border-color:#6366f1;transform:scale(1.05)}
  .cal-day.today{border-color:#60a5fa;color:#fff;font-weight:bold}
  .cal-day.empty{background:transparent;border:none;cursor:default}
  .cal-day.empty:hover{transform:none}
  .cal-day .dot{position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%}
  .cal-day .dot.work{background:var(--w)}
  .cal-day .dot.setup{background:var(--s)}
  .cal-day .dot.break{background:var(--b)}
  .cal-day .dot.no-mat{background:var(--n)}

  .day-form{margin-top:15px;padding-top:15px;border-top:1px solid var(--brd)}
  .day-form h4{font-size:.9rem;margin-bottom:10px;color:#60a5fa}
  .day-form .actions{display:flex;gap:8px;margin-top:10px}
  .day-form .actions .btn{margin-top:0}
  .day-form .actions .btn.danger{background:#dc2626}
  .day-form .actions .btn.danger:hover{background:#b91c1c}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:10px 18px;border-radius:8px;font-size:.85rem;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}

  .hidden{display:none !important}

  #loginOverlay .modal{max-width:380px}
  #loginOverlay h3{margin-bottom:15px;font-size:1.1rem}
  #loginOverlay .err{color:#fca5a5;font-size:.8rem;margin-top:8px;min-height:18px}
  .guest-note{background:#1e293b;border-left:3px solid #f59e0b;padding:8px 12px;border-radius:6px;font-size:.8rem;color:#fcd34d;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <h1>🏭 Центральный Ситуационный Центр <span id="connBadge" class="badge">…</span></h1>
  <div class="stats">
    <div class="st-card"><h3>В работе</h3><div class="val" style="color:var(--w)" id="wc">0</div></div>
    <div class="st-card"><h3>Наладка</h3><div class="val" style="color:var(--s)" id="sc">0</div></div>
    <div class="st-card"><h3>Поломка</h3><div class="val" style="color:var(--b)" id="bc">0</div></div>
    <div class="st-card"><h3>OEE Цеха</h3><div class="val" style="color:#60a5fa" id="oee">0%</div></div>
  </div>
</header>

<div class="toolbar">
  <button onclick="resetToDemo()" id="resetBtn" class="hidden">↺ Сбросить в демо-данные</button>
  <button onclick="openLogin()" id="loginBtn" class="btn-login">🔑 Войти как админ</button>
  <button onclick="doLogout()" id="logoutBtn" class="btn-logout hidden">🚪 Выйти</button>
  <span id="userBadge" class="badge role-guest">👤 гость (только чтение)</span>
</div>

<div class="grid" id="g"></div>

<!-- Модалка редактирования -->
<div class="ov" id="ov" onclick="if(event.target===this)closeM()">
  <div class="modal">
    <div class="ch">
      <span id="mt">Станок</span>
      <button style="background:none;border:none;color:#fff;cursor:pointer;font-size:1.2rem" onclick="closeM()" aria-label="Закрыть">&times;</button>
    </div>

    <div id="editScreen">
      <div id="guestNotice" class="guest-note hidden">
        ⚠️ Вы вошли как гость. Редактирование недоступно. Нажмите «🔑 Войти как админ», чтобы получить доступ.
      </div>

      <div id="machineFields">
        <div class="fg">
          <label>Статус</label>
          <select id="fst">
            <option value="work">🟢 В работе / Норма</option>
            <option value="setup">🟡 Наладка / Обсуждение</option>
            <option value="break">🔴 Поломка / Внимание</option>
            <option value="no-mat">🔵 Нет заготовки / Ожидание</option>
          </select>
        </div>
        <div class="fg"><label>Изготавливаемая деталь:</label><input type="text" id="fp"></div>
        <div class="fg"><label>Количество (шт):</label><input type="number" id="fc" min="0"></div>
        <div class="fg"><label>Текущая загрузка (%):</label><input type="number" id="fl" min="0" max="100"></div>
        <div class="fg">
          <label>Причина простоя (если станок не в работе)</label>
          <textarea id="fr" placeholder="Например: ожидание материала, сбой привода..."></textarea>
        </div>
      </div>

      <div id="issueFields" class="hidden">
        <div class="fg">
          <label>Индикация</label>
          <div class="status-toggle">
            <label><input type="radio" name="issueStatus" value="ok"><div class="opt ok">🟢 Норма / Решено</div></label>
            <label><input type="radio" name="issueStatus" value="alert"><div class="opt alert">🔴 Внимание / Проблема</div></label>
          </div>
        </div>
        <div class="fg">
          <label>Блокнот (заметки, задачи, комментарии)</label>
          <textarea id="fnote" placeholder="Введите текст..."></textarea>
        </div>
      </div>

      <button class="btn" id="saveBtn" onclick="saveM()">Сохранить в базу</button>
      <button class="btn btn-secondary" id="openJournalBtn" onclick="openJournal()">📅 Журнал по дням</button>
    </div>

    <div id="journalScreen" class="hidden">
      <div class="cal-head">
        <button class="cal-nav" onclick="calPrevMonth()">‹</button>
        <div class="month" id="calMonthLabel">—</div>
        <button class="cal-nav" onclick="calNextMonth()">›</button>
      </div>
      <div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="day-form hidden" id="dayForm">
        <h4 id="dayFormTitle">—</h4>
        <div class="fg">
          <label>Статус за день</label>
          <select id="dStatus">
            <option value="work">🟢 В работе / Норма</option>
            <option value="setup">🟡 Наладка</option>
            <option value="break">🔴 Поломка / Простой</option>
            <option value="no-mat">🔵 Нет заготовки</option>
          </select>
        </div>
        <div class="fg"><label>Количество изготовлено (шт):</label><input type="number" id="dCount" min="0" value="0"></div>
        <div class="fg"><label>Комментарий за день:</label><textarea id="dNote" placeholder="Что делали..."></textarea></div>
        <div class="actions">
          <button class="btn" onclick="saveDay()">💾 Сохранить</button>
          <button class="btn danger" onclick="deleteDay()">🗑 Удалить</button>
        </div>
      </div>

      <button class="btn btn-secondary" onclick="closeJournal()">← Назад к станку</button>
    </div>
  </div>
</div>

<!-- Модалка входа -->
<div class="ov" id="loginOverlay" onclick="if(event.target===this)closeLogin()">
  <div class="modal">
    <div class="ch">
      <span>🔑 Вход для администратора</span>
      <button style="background:none;border:none;color:#fff;cursor:pointer;font-size:1.2rem" onclick="closeLogin()">&times;</button>
    </div>
    <div class="fg">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="fg">
      <label>Пароль</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginSubmit" onclick="submitLogin()">Войти</button>
    <button class="btn btn-secondary" onclick="closeLogin()">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FIREBASE CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyD7IyidqpsQNxOyIO-gXiC2Y0iTgfGuBEw",
  authDomain: "nahabino-d8803.firebaseapp.com",
  databaseURL: "https://nahabino-d8803-default-rtdb.firebaseio.com",
  projectId: "nahabino-d8803",
  storageBucket: "nahabino-d8803.firebasestorage.app",
  messagingSenderId: "523106922724",
  appId: "1:523106922724:web:daa409b569cb12653b3cf1"
};

// Инициализация Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const BASE = firebaseConfig.databaseURL;
const ROOT_URL = BASE + "/.json";
const JOURNAL_URL = BASE + "/journal.json";

let currentUser = null;

/* ============================================================
   ДЕМО-ДАННЫЕ (используются только для инициализации пустой базы)
   ============================================================ */
const initialData = {
  1:  {id:1,  name:"Фрезерный 3Х Китай №1",              type:"milling", cnc:"Fanuc",   status:"work",   part:"Корпус редуктора",       count:14,  load:85, reason:""},
  2:  {id:2,  name:"Фрезерный 3Х Китай №2",              type:"milling", cnc:"Fanuc",   status:"work",   part:"Фланец А3",              count:32,  load:78, reason:""},
  3:  {id:3,  name:"Фрезерный 3Х Китай №3",              type:"milling", cnc:"Fanuc",   status:"setup",  part:"Переналадка",            count:0,   load:0,  reason:"Переналадка на новую деталь"},
  4:  {id:4,  name:"Рободрил 5-ти координатный",         type:"milling", cnc:"Fanuc",   status:"work",   part:"Лопатка турбины",        count:3,   load:92, reason:""},
  5:  {id:5,  name:"Фрезерный 3+1 координатный",         type:"milling", cnc:"Fanuc",   status:"no-mat", part:"Ожидание",               count:45,  load:0,  reason:"Нет заготовок"},
  6:  {id:6,  name:"Китайский Токарно-Фрезерный",        type:"turning", cnc:"Fanuc",   status:"work",   part:"Вал приводной",          count:19,  load:70, reason:""},
  7:  {id:7,  name:"Okuma Токарно-Фрезерная",            type:"turning", cnc:"OSP",     status:"work",   part:"Шпиндель точный",        count:8,   load:88, reason:""},
  8:  {id:8,  name:"Токарный станок Малютка №1",         type:"turning", cnc:"NC-201",  status:"work",   part:"Шпилька М12",            count:142, load:50, reason:""},
  9:  {id:9,  name:"Токарный станок Малютка №2",         type:"turning", cnc:"NC-201",  status:"no-mat", part:"Ожидание",               count:80,  load:0,  reason:"Ждём материал"},
  10: {id:10, name:"Токарный с револьверной головкой Siemens", type:"turning", cnc:"Siemens", status:"work", part:"Муфта муфтовая",     count:24,  load:82, reason:""},
  11: {id:11, name:"Токарный с револьверной головкой",   type:"turning", cnc:"ЧПУ",     status:"break",  part:"Сбой привода",           count:11,  load:0,  reason:"Сбой привода"},
  12: {id:12, name:"Оперативная сводка",                 type:"operational", cnc:"Опер.", status:"ok",    note:"Смена работает в штатном режиме."},
  13: {id:13, name:"Фрезерная группа",                   type:"operational", cnc:"Опер.", status:"alert", note:"Требуется поставка фрез."},
  14: {id:14, name:"Токарная группа",                    type:"production",  cnc:"Произв.", status:"alert", note:"Проверка ОТК."},
  15: {id:15, name:"Участок сборки",                     type:"production",  cnc:"Произв.", status:"ok",    note:""}
};

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let macs = [];
let curId = null;
let curIsIssue = false;
let journal = {};
let calYear, calMonth;
let selectedDay = null;
let localDemo = JSON.parse(JSON.stringify(initialData));
let lastOk = false;

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function isIssue(t){ return t === 'operational' || t === 'production'; }
function isAdmin(){ return !!currentUser; }

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function toast(msg, ok){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? '#10b981' : '#ef4444';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 3000);
}
function setConn(ok){
  if (ok === lastOk) return;
  lastOk = ok;
  const b = document.getElementById('connBadge');
  if (ok) { b.textContent = '● онлайн'; b.className = 'badge live'; }
  else    { b.textContent = '● офлайн'; b.className = 'badge offline'; }
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

/* ============================================================
   АВТОРИЗАЦИЯ
   ============================================================ */
function openLogin(){
  document.getElementById('loginErr').textContent = '';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginOverlay').classList.add('active');
  setTimeout(()=>document.getElementById('loginEmail').focus(), 100);
}
function closeLogin(){
  document.getElementById('loginOverlay').classList.remove('active');
}
async function submitLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginSubmit');

  if (!email || !password) { errEl.textContent = 'Введите email и пароль'; return; }
  btn.disabled = true;
  errEl.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(email, password);
    closeLogin();
    toast('Вход выполнен: ' + email, true);
  } catch (e) {
    console.error(e);
    let msg = 'Ошибка входа';
    if (e.code === 'auth/user-not-found') msg = 'Пользователь не найден';
    else if (e.code === 'auth/wrong-password') msg = 'Неверный пароль';
    else if (e.code === 'auth/invalid-email') msg = 'Неверный email';
    else if (e.code === 'auth/invalid-credential') msg = 'Неверный email или пароль';
    else msg = e.message || 'Ошибка входа';
    errEl.textContent = msg;
  } finally {
    btn.disabled = false;
  }
}
function doLogout(){
  auth.signOut().then(() => toast('Вы вышли', true));
}

auth.onAuthStateChanged(user => {
  currentUser = user;
  updateAuthUI();
  loadData();
});

function updateAuthUI(){
  const admin = isAdmin();
  document.getElementById('resetBtn').classList.toggle('hidden', !admin);
  document.getElementById('loginBtn').classList.toggle('hidden', admin);
  document.getElementById('logoutBtn').classList.toggle('hidden', !admin);

  const b = document.getElementById('userBadge');
  if (admin) {
    b.textContent = '👤 ' + (currentUser.email || 'админ');
    b.className = 'badge role-admin';
  } else {
    b.textContent = '👤 гость (только чтение)';
    b.className = 'badge role-guest';
  }
}

/* ============================================================
   ЗАГРУЗКА
   ============================================================ */
async function loadData() {
  try {
    const [rootResp, jResp] = await Promise.all([fetch(ROOT_URL), fetch(JOURNAL_URL)]);
    if (!rootResp.ok) throw new Error("HTTP " + rootResp.status);

    let data = await rootResp.json();
    if (!data && isAdmin()) {
      await fetch(ROOT_URL, { method: "PUT", body: JSON.stringify(initialData) });
      data = initialData;
    }
    if (!data) data = {};

    macs = Object.values(data).filter(Boolean).sort((a,b)=>a.id-b.id);
    journal = jResp.ok ? (await jResp.json()) || {} : {};

    setConn(true);
    render();
  } catch (e) {
    console.error("loadData error:", e);
    setConn(false);
    if (macs.length === 0) {
      macs = Object.values(localDemo).sort((a,b)=>a.id-b.id);
      render();
    }
  }
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render(){
  const grid = document.getElementById('g');
  grid.innerHTML = '';

  const order = [
    { key:'milling',      title:'Фрезерная группа',        cls:'milling'     },
    { key:'turning',      title:'Токарная группа',         cls:'turning'     },
    { key:'operational',  title:'Оперативные вопросы',     cls:'operational' },
    { key:'production',   title:'Производственные вопросы',cls:'production'  }
  ];

  order.forEach(sec => {
    const group = macs.filter(m => m.type === sec.key);
    if (group.length === 0) return;
    const t = document.createElement('h2');
    t.className = 'gt ' + sec.cls;
    t.textContent = sec.title;
    grid.appendChild(t);
    group.forEach(m => grid.appendChild(buildCard(m)));
  });

  const machines = macs.filter(m=>!isIssue(m.type));
  const w = machines.filter(m=>m.status==='work').length;
  const s = machines.filter(m=>m.status==='setup').length;
  const b = machines.filter(m=>m.status==='break').length;
  document.getElementById('wc').textContent = w;
  document.getElementById('sc').textContent = s;
  document.getElementById('bc').textContent = b;

  let sumLoad = 0, working = 0;
  machines.forEach(m=>{
    if (m.status==='work') { sumLoad += Number(m.load)||0; working++; }
  });
  const total = machines.length || 1;
  const availability = 1 - b/total;
  const avgLoad = working > 0 ? sumLoad/working : 0;
  let oee = Math.round(avgLoad * availability);
  oee = Math.max(0, Math.min(100, oee));
  document.getElementById('oee').textContent = oee + '%';
}

function buildCard(m){
  const c = document.createElement('div');
  c.onclick = () => openM(m.id);

  if (isIssue(m.type)) {
    const isAlert = m.status === 'alert';
    const prefix  = m.type === 'operational' ? 'op' : 'pr';
    c.className = `card ${prefix}-${isAlert ? 'alert' : 'ok'}`;
    if (isAlert) c.classList.add('break-active');
    const label = isAlert ? '🔴 Внимание' : '🟢 Норма';
    const note  = m.note || '';
    c.innerHTML = `
      <div class="ch">
        <div>${esc(m.name)}</div>
        <div style="font-size:0.75rem;color:var(--m);font-weight:400">${esc(m.cnc)}</div>
      </div>
      <div style="font-size:0.85rem;font-weight:bold;margin-bottom:6px">${label}</div>
      ${note
        ? `<div class="note-preview">${esc(note)}</div>`
        : `<div style="font-size:.8rem;color:var(--m);font-style:italic">Заметок нет</div>`}
    `;
    return c;
  }

  c.className = `card ${m.status}`;
  if (m.status === 'break') c.classList.add('break-active');

  const lbl = m.status==='work' ? '🟢 В работе'
            : m.status==='setup' ? '🟡 Наладка'
            : m.status==='break' ? '🔴 Поломка'
            : '🔵 Нет заготовки';

  let reasonHtml = '';
  const reason = (m.reason || '').trim();
  if (m.status !== 'work' && reason) {
    reasonHtml = `
      <div class="reason ${m.status}">
        <span class="reason-label">Причина простоя</span>
        ${esc(reason)}
      </div>`;
  }

  c.innerHTML = `
    <div class="ch">
      <div>${esc(m.name)}</div>
      <div style="font-size:0.75rem;color:var(--m);font-weight:400">${esc(m.cnc)}</div>
    </div>
    <div style="font-size:0.8rem;font-weight:bold;margin-bottom:8px">${lbl}</div>
    <div class="row"><span>Деталь:</span><span>${esc(m.part)}</span></div>
    <div class="row"><span>Готово:</span><span>${esc(m.count)} шт</span></div>
    <div class="row"><span>Загрузка:</span><span>${esc(m.load)}%</span></div>
    ${reasonHtml}`;
  return c;
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
function openM(id){
  curId = id;
  const m = macs.find(x=>x.id===id);
  if (!m) return;
  curIsIssue = isIssue(m.type);

  document.getElementById('mt').textContent = m.name;

  const machineFields = document.getElementById('machineFields');
  const issueFields   = document.getElementById('issueFields');
  const journalBtn    = document.getElementById('openJournalBtn');
  const guestNotice   = document.getElementById('guestNotice');
  const saveBtn       = document.getElementById('saveBtn');

  journalBtn.classList.toggle('hidden', curIsIssue);
  guestNotice.classList.toggle('hidden', isAdmin());

  if (curIsIssue) {
    machineFields.classList.add('hidden');
    issueFields.classList.remove('hidden');
    const radios = document.getElementsByName('issueStatus');
    radios.forEach(r => r.checked = (r.value === (m.status === 'alert' ? 'alert' : 'ok')));
    document.getElementById('fnote').value = m.note || '';
  } else {
    machineFields.classList.remove('hidden');
    issueFields.classList.add('hidden');
    document.getElementById('fst').value = m.status;
    document.getElementById('fp').value  = m.part;
    document.getElementById('fc').value  = m.count;
    document.getElementById('fl').value  = m.load;
    document.getElementById('fr').value  = m.reason || '';
  }

  // Блокируем все поля для гостей
  const inputs = document.querySelectorAll('#editScreen input, #editScreen select, #editScreen textarea, #editScreen button');
  inputs.forEach(el => {
    if (el.id === 'openJournalBtn') return; // журнал гостям тоже посмотреть можно
    el.disabled = !isAdmin();
  });
  saveBtn.disabled = !isAdmin();

  showEditScreen();
  document.getElementById('ov').classList.add('active');
}

function closeM(){
  document.getElementById('ov').classList.remove('active');
  curId = null;
  curIsIssue = false;
  selectedDay = null;
  document.getElementById('dayForm').classList.add('hidden');
}

function showEditScreen(){
  document.getElementById('editScreen').classList.remove('hidden');
  document.getElementById('journalScreen').classList.add('hidden');
}
function showJournalScreen(){
  document.getElementById('editScreen').classList.add('hidden');
  document.getElementById('journalScreen').classList.remove('hidden');
}

/* ============================================================
   СОХРАНЕНИЕ КАРТОЧКИ
   ============================================================ */
async function saveM(){
  if (curId === null) return;
  if (!isAdmin()) { toast('Нужно войти как админ'); return; }

  const btn = document.getElementById('saveBtn');
  let updates = {};

  if (curIsIssue) {
    const selected = document.querySelector('input[name="issueStatus"]:checked');
    updates = {
      status: selected ? selected.value : 'ok',
      note:   document.getElementById('fnote').value
    };
  } else {
    updates = {
      status: document.getElementById('fst').value,
      part:   document.getElementById('fp').value.trim(),
      count:  parseInt(document.getElementById('fc').value, 10) || 0,
      load:   Math.max(0, Math.min(100, parseInt(document.getElementById('fl').value, 10) || 0)),
      reason: document.getElementById('fr').value.trim()
    };
  }

  btn.disabled = true;
  try {
    const res = await fetch(`${BASE}/${curId}.json`, {
      method: "PATCH",
      body: JSON.stringify(updates)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    closeM();
    await loadData();
    toast("Сохранено", true);
  } catch (e) {
    console.error("saveM error:", e);
    toast("Не удалось сохранить. Проверьте права доступа.");
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
   КАЛЕНДАРЬ
   ============================================================ */
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function openJournal(){
  const today = new Date();
  calYear  = today.getFullYear();
  calMonth = today.getMonth();
  selectedDay = null;
  document.getElementById('dayForm').classList.add('hidden');
  showJournalScreen();
  renderCalendar();
}
function closeJournal(){ showEditScreen(); }

function calPrevMonth(){
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}
function calNextMonth(){
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar(){
  document.getElementById('calMonthLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const first = new Date(calYear, calMonth, 1);
  let startOffset = first.getDay() - 1;
  if (startOffset < 0) startOffset = 6;

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  for (let i = 0; i < startOffset; i++) {
    const e = document.createElement('div');
    e.className = 'cal-day empty';
    grid.appendChild(e);
  }

  const macJournal = journal[curId] || {};
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(calYear, calMonth, d);
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if (key === todayKey) cell.classList.add('today');
    cell.textContent = d;

    const rec = macJournal[key];
    if (rec && rec.status) {
      const dot = document.createElement('span');
      dot.className = 'dot ' + rec.status;
      cell.appendChild(dot);
    }
    cell.onclick = () => selectDay(key);
    grid.appendChild(cell);
  }
}

function selectDay(key){
  selectedDay = key;
  const rec = (journal[curId] || {})[key] || { status:'work', count:0, note:'' };

  const [y,m,d] = key.split('-').map(Number);
  document.getElementById('dayFormTitle').textContent =
    `Запись на ${d} ${MONTHS[m-1].toLowerCase()} ${y}`;

  document.getElementById('dStatus').value = rec.status || 'work';
  document.getElementById('dCount').value  = rec.count || 0;
  document.getElementById('dNote').value   = rec.note || '';

  document.getElementById('dayForm').classList.remove('hidden');

  // Блокировка для гостей
  const dayInputs = document.querySelectorAll('#dayForm input, #dayForm select, #dayForm textarea, #dayForm button');
  dayInputs.forEach(el => el.disabled = !isAdmin());
}

async function saveDay(){
  if (!selectedDay || curId === null) return;
  if (!isAdmin()) { toast('Нужно войти как админ'); return; }

  const rec = {
    status: document.getElementById('dStatus').value,
    count:  parseInt(document.getElementById('dCount').value, 10) || 0,
    note:   document.getElementById('dNote').value.trim(),
    updated: new Date().toISOString()
  };

  try {
    const res = await fetch(`${BASE}/journal/${curId}/${selectedDay}.json`, {
      method: "PUT",
      body: JSON.stringify(rec)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    if (!journal[curId]) journal[curId] = {};
    journal[curId][selectedDay] = rec;
    renderCalendar();
    toast("Запись сохранена", true);
  } catch (e) {
    console.error("saveDay error:", e);
    toast("Не удалось сохранить запись.");
  }
}

async function deleteDay(){
  if (!selectedDay || curId === null) return;
  if (!isAdmin()) { toast('Нужно войти как админ'); return; }
  if (!confirm("Удалить запись за этот день?")) return;

  try {
    const res = await fetch(`${BASE}/journal/${curId}/${selectedDay}.json`, {
      method: "DELETE"
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    if (journal[curId]) delete journal[curId][selectedDay];
    document.getElementById('dayForm').classList.add('hidden');
    selectedDay = null;
    renderCalendar();
    toast("Запись удалена", true);
  } catch (e) {
    console.error("deleteDay error:", e);
    toast("Не удалось удалить запись.");
  }
}

/* ============================================================
   СБРОС В ДЕМО-ДАННЫЕ (только для админов)
   ============================================================ */
async function resetToDemo(){
  if (!isAdmin()) { toast('Нужно войти как админ'); return; }
  if (!confirm("Сбросить ВСЕ данные (карточки и журнал) в демо-значения?\n\nЭто действие необратимо!")) return;
  try {
    await fetch(ROOT_URL, { method: "PUT", body: JSON.stringify(initialData) });
    await fetch(JOURNAL_URL, { method: "DELETE" });
    journal = {};
    await loadData();
    toast("База сброшена в демо-данные", true);
  } catch (e) {
    console.error("resetToDemo error:", e);
    toast("Не удалось сбросить базу.");
  }
}
